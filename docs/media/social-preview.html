<!doctype html>
<!-- The repository's social preview. Render it with:
     chrome --headless=new --screenshot=docs/media/social-preview.png --window-size=1280,640 --hide-scrollbars docs/media/social-preview.html -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Fredoka; src: url("../../engine/remotion/fonts/Fredoka.ttf"); }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: radial-gradient(circle at 20% 30%, #2a1f4d 0%, #120d24 60%, #0b0818 100%);
    font-family: Fredoka, sans-serif; color: #fff; position: relative;
  }
  .text { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  h1 { font-size: 112px; margin: 0; letter-spacing: -2px; line-height: 1; }
  h1 span { color: #ffcc4d; }
  p { font-size: 34px; line-height: 1.25; margin: 22px 0 30px; color: #e6e1ff; }
  .tags { display: flex; gap: 12px; flex-wrap: wrap; }
  .tags b { font-weight: 500; font-size: 22px; padding: 8px 18px; border-radius: 999px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25); }
  .posters { position: absolute; right: -40px; top: -30px; width: 680px; height: 700px; }
  .posters img { position: absolute; width: 180px; height: 320px; border-radius: 18px; box-shadow: 0 18px 40px rgba(0,0,0,.55); border: 3px solid rgba(255,255,255,.85); object-fit: cover; }
</style>
</head>
<body>
  <div class="text">
    <h1>un<span>faced</span></h1>
    <p>Faceless short videos for Reels, TikTok and Shorts, made with Claude Code.</p>
    <div class="tags"><b>12 styles</b><b>free &amp; local</b><b>no API key</b></div>
  </div>
  <div class="posters">
    <img src="../../gallery/media/03-flat-cartoon.png" style="left: 40px; top: 60px; transform: rotate(-8deg)">
    <img src="../../gallery/media/10-neon-synthwave.png" style="left: 240px; top: 20px; transform: rotate(4deg)">
    <img src="../../gallery/media/11-watercolour.png" style="left: 440px; top: 70px; transform: rotate(-3deg)">
    <img src="../../gallery/media/01-soft-3d.png" style="left: 120px; top: 380px; transform: rotate(5deg)">
    <img src="../../gallery/media/09-16-bit-pixel-art.png" style="left: 330px; top: 360px; transform: rotate(-6deg)">
    <img src="../../gallery/media/08-vintage-comic.png" style="left: 530px; top: 400px; transform: rotate(7deg)">
  </div>
</body>
</html>
